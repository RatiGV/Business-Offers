  <section class="section section--tight" id="apply">
    <div class="container">
      <div class="lead">
        <div class="lead__intro">
          <h2 class="lead__title caps">დარეგისტრირდი კურსზე</h2>
          <p>შეავსე ფორმა და სმარტ აკადემიის გუნდი მალე დაგიკავშირდება სპეციალური შეთავაზების დეტალებით.</p>
        </div>
        <form class="lead__form" id="leadForm" novalidate>
          <label class="field"><span>სახელი და გვარი</span><input type="text" name="name" autocomplete="name" required maxlength="120"></label>
          <label class="field"><span>ტელეფონი</span><input type="tel" name="phone" autocomplete="tel" inputmode="tel" required maxlength="40"></label>
          <label class="field"><span>ელ. ფოსტა</span><input type="email" name="email" autocomplete="email" required maxlength="160"></label>
          <label class="field"><span>სასურველი კურსი</span><select name="course" id="leadCourse" required><option value="">აირჩიე კურსი</option></select></label>
          <input type="text" name="website" class="lead__hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn btn--primary lead__submit" type="submit">გაგზავნა</button>
          <p class="lead__msg" id="leadMsg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>
